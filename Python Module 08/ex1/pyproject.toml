[project]
name = "loading"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
